server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets: check MCO static bundle first, fall back to n8n container assets
    location /assets/ {
        try_files $uri @n8n_assets;
    }

    location @n8n_assets {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Reverse proxy /api requests to FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy n8n subpath assets
    location /n8n/assets/ {
        proxy_pass http://n8n:5678/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Reverse proxy n8n subpath static files
    location /n8n/static/ {
        proxy_pass http://n8n:5678/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Reverse proxy n8n subpath REST API
    location /n8n/rest/ {
        proxy_pass http://n8n:5678/rest/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Reverse proxy /n8n/ requests to n8n canvas container
    location /n8n/ {
        proxy_pass http://n8n:5678/n8n/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow embedded iframe from same origin
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Reverse proxy root n8n REST endpoints if called directly
    location /rest/ {
        proxy_pass http://n8n:5678/rest/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /types/ {
        proxy_pass http://n8n:5678/types/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy backend health checks
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Single Page Application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
